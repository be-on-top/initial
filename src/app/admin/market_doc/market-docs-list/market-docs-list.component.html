<div class="container mt-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Gestion des Documents Marketing</h2>
    <button class="btn btn-primary" (click)="goToCreate()">
      + Ajouter un document
    </button>
  </div>

  <!-- Liste -->
  <div class="row g-4">

    <!-- Card -->
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let doc of marketingDocs">
      <div class="card h-100 shadow-sm">

        <div class="card-body d-flex flex-column">

          <!-- Date -->
          <div class="text-muted small mb-2">
            {{ doc.createdAt?.toDate() | date:'dd/MM/yyyy' }}
          </div>

          <!-- Titre -->
          <h5 class="card-title">
            {{ doc.title }}
          </h5>

          <!-- Commentaire -->
          <p class="card-text text-muted flex-grow-1">
            {{ doc.comment || '-' }}
          </p>

          <!-- Preview -->
          <div class="text-center mb-3" *ngIf="doc.fileUrl">
            <img
              *ngIf="isImage(doc.fileUrl)"
              [src]="doc.fileUrl"
              alt="preview"
              class="img-fluid rounded mb-2 w-75 pack"
              
            />

            <a
              [href]="doc.fileUrl"
              target="_blank"
              class="btn btn-sm btn-outline-info w-100"
            >
              Voir le fichier
            </a>
          </div>

          <!-- Actions -->
          <div class="d-flex justify-content-end gap-2 mt-auto">
            <button class="btn btn-sm btn-warning" (click)="onEdit(doc)">
              Modifier
            </button>

            <button
              class="btn btn-sm btn-danger"
              *ngIf="doc.id"
              (click)="onDelete(doc.id, doc.fileUrl)"
            >
              Supprimer
            </button>
          </div>

        </div>

      </div>
    </div>

    <!-- Empty state -->
    <div *ngIf="marketingDocs.length === 0" class="text-center text-muted py-5">
      Aucun document pour le moment.
    </div>

  </div>

</div>
