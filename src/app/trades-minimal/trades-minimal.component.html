<div class="container py-3 min-vh-50">
  <h1 class="mb-5 index">Inventaire des formations métiers</h1>

  <div *ngIf="isLoading" class="d-flex flex-column align-items-center justify-content-center py-5 my-5"
    aria-live="polite" role="status">
    <div class="spinner-border text-primary" aria-hidden="true"></div>
    <p class="mt-3 text-muted">Chargement du catalogue...</p>
  </div>

  <div *ngIf="!isLoading">

    <ul class="list-group" *ngIf="ungroupedTrades.length > 0">
      <li *ngFor="let trade of ungroupedTrades" class="list-group-item d-flex align-items-start">
        <a [routerLink]="['/formation', trade.sigle]" class="d-block">
          <span>{{ trade.denomination }}</span><br>
          <small class="text-muted fst-italic">{{ trade.sigle }}</small>
        </a>
        <button class="border-0 bg-transparent ms-2 p-0 text-secondary"
          (click)="copyUrl(trade.sigle); $event.stopPropagation()"
          [attr.aria-label]="'Copier l URL de ' + trade.denomination" title="Copier l'URL">
          <i class="bi bi-copy" aria-hidden="true"></i>
        </button>
      </li>
    </ul>

    <section *ngFor="let group of groupedTrades" class="mt-4">
      <h2 class="h4 mb-2">{{ group.key }}</h2>
      <ul class="list-group">
        <li *ngFor="let trade of group.value" class="list-group-item d-flex align-items-start">
          <a [routerLink]="['/formation', trade.sigle]" class="d-block">
            <span>{{ trade.denomination }}</span><br>
            <small class="text-muted fst-italic">{{ trade.sigle }}</small>
          </a>
          <button class="border-0 bg-transparent ms-2 p-0 text-secondary"
            (click)="copyUrl(trade.sigle); $event.stopPropagation()"
            [attr.aria-label]="'Copier l URL de ' + trade.denomination" title="Copier l'URL">
            <i class="bi bi-copy" aria-hidden="true"></i>
          </button>
        </li>
      </ul>
    </section>

    <div *ngIf="tradesData.length === 0" class="alert alert-info text-center mt-4" role="alert">
      Aucune formation n'est disponible pour le moment.
    </div>
  </div>

  <hr>
  <div class="mt-4 d-flex justify-content-center">
    <a href="/centersIndex" class="btn btn-light"
      aria-label="Accéder à la liste complète des centres de formation du réseau">
      <i class="bi bi-collection"></i>
      Inventaire des centres de formation
    </a>
  </div>
</div>
