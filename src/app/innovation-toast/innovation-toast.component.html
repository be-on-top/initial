<!-- Toast -->
<div class="toast-container position-fixed top-0 end-0 p-3 innovation-toast-container">

  <div #toastElement
       class="toast innovation-toast border-0 shadow bg-dark text-white"
       role="status"
       aria-live="polite"
       aria-atomic="true">

    <div class="d-flex align-items-center">

      <div class="toast-body">

        <!-- bouton accessible au lieu d'un div cliquable -->
        <button type="button"
                class="btn btn-link text-white text-start text-decoration-none p-0"
                (click)="openDetails()"
                aria-label="Voir les détails du prix Innovation Awards 2026">

          <span aria-hidden="true">🏆</span>
          <strong class="ms-2">Lauréat Innovation Awards 2026</strong>

          <span class="d-block small text-white-50">
            Voir les détails →
          </span>

        </button>

      </div>

      <!-- bouton fermer -->
      <button type="button"
              class="btn-close btn-close-white me-2 m-auto"
              aria-label="Fermer la notification"
              (click)="dismiss()">
      </button>

    </div>

  </div>

</div>

<!-- Modal (détail de l'award) -->
<!-- Modal -->
<div #innovationModal
     class="modal fade"
     id="innovationDetailModal"
     tabindex="-1"
     aria-labelledby="innovationDetailModalLabel"
     aria-hidden="true">

  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content bg-dark text-white">

      <div class="modal-header border-0">

        <h5 class="modal-title" id="innovationDetailModalLabel">
          Innovation Awards 2026 🏆
        </h5>

        <button type="button"
                class="btn-close btn-close-white"
                aria-label="Fermer la fenêtre"
                (click)="closeModal()">
        </button>

      </div>

      <div class="modal-body">

        <p>
          Notre application a remporté le prix de la catégorie
          « Politique RH innovante au service de l'attractivité ».
        </p>

        <p>
          Plus d'informations sur
          <a href="https://awards.sitl.eu/sitlawards2026/fr/page/home"
             target="_blank"
             rel="noopener noreferrer"
             class="link-light fw-semibold"
             (click)="onExternalLinkClick($event)">
            le site officiel SITL ↗
            <span class="visually-hidden">
              (ouvre un site externe dans un nouvel onglet)
            </span>

          </a>

        </p>

      </div>

    </div>

  </div>

</div>
