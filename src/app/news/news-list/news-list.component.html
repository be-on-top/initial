<div class="container mt-4">

    <h1 class="newsTitle mb-4">Actualités (ou n'importe quel titre qui justifie le truc)</h1>
    <!-- <pre>{{ news$ | async | json }}</pre> -->

    <div class="alert bg-primary text-light w-100 text-center">Non une application métier n'est pas un site éditorial. A utiliser avec parcimonie pour vos éléments de langage. </div>

    <div class="list-group">

        <a *ngFor="let n of news$ | async" [routerLink]="['/news', n.id]"
            class="list-group-item list-group-item-action">


            <h2 class="h4 mb-1">{{ n.title }}</h2>

            <p class="mb-1 text-muted">
                {{ stripHtml(n.content) | slice:0:120 }}...
            </p>

        </a>

    </div>

</div>
