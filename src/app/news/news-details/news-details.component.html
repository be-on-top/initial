<div class="container mt-4" *ngIf="news; else loading">

    <ng-container *ngIf="news.heroImage; else noImageLayout">
        <h1 class="mb-4">{{ news.title }}</h1>

        <div class="card shadow-sm mb-4">

            <div class="card-header p-0 border-0 ratio ratio-21x9">
                <img [src]="news.heroImage" alt="Illustration de l'article : {{ news.title }}"
                    class="img-fluid object-fit-cover w-100 h-100" />
            </div>

            <div class="card-body">

                <!-- <h1 class="card-title h2 mb-3">{{ news.title }}</h1> -->

                <p class="card-text text-muted small mb-3">
                    {{ news.createdAt?.toDate?.() | date:'medium' }}
                </p>

                <div class="card-text news-content" [innerHTML]="news.content"></div>
            </div>

        </div>

    </ng-container>



    <ng-template #noImageLayout>
        <h1 class="mb-4">{{ news.title }}</h1>

        <div class="row">
            <div class="col-md-12">
                <div class="news-content" [innerHTML]="news.content"></div>
            </div>
        </div>
    </ng-template>

    <a routerLink="/news" class="btn btn-outline-secondary my-4" aria-label="Retourner à la liste des articles">
        <span aria-hidden="true">←</span> Retour à la liste des articles
    </a>

</div>

<ng-template #loading>
    <div class="text-center mt-5" role="status" aria-live="polite">
        <div class="spinner-border" aria-hidden="true"></div>
        <span class="visually-hidden">Chargement de l'article en cours...</span>
    </div>
</ng-template>

<hr>
