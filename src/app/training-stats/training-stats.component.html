
<div class="container py-4">

  <h2 class="mb-4">Training Statistics</h2>

  <!-- Liste des trades -->
  <div *ngFor="let trade of trades">

    <!-- On récupère les étudiants correspondant à ce trade -->
    <ng-container *ngIf="statsByTrade[trade] && statsByTrade[trade].total > 0">

      <div class="card mb-4 shadow">
        <div class="card-body">

          <h4 class="card-title">{{ trade }}</h4>
          <p class="text-muted">Total candidates : {{ statsByTrade[trade].total }}</p>

          <ul class="list-group">

            <!-- Demandeurs d'emploi -->
            <li class="list-group-item d-flex justify-content-between">
              <span>Unemployed (France Travail)</span>
              <span>{{ statsByTrade[trade].unemployed }}</span>
            </li>

            <!-- Étudiants -->
            <li class="list-group-item d-flex justify-content-between">
              <span>Students</span>
              <span>{{ statsByTrade[trade].students }}</span>
            </li>

            <!-- CDD -->
            <li class="list-group-item d-flex justify-content-between">
              <span>CDD</span>
              <span>{{ statsByTrade[trade].cdd }}</span>
            </li>

            <!-- CDI -->
            <li class="list-group-item d-flex justify-content-between">
              <span>CDI</span>
              <span>{{ statsByTrade[trade].cdi }}</span>
            </li>

          </ul>

        </div>
      </div>
    </ng-container>
  </div>

</div>
